<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>refind-note</title>
    <script>
      // 在样式加载前就定下主题，避免启动时闪一下另一套配色。
      // 这段逻辑与 src/theme.ts 的 resolve() 对应，改动时要同步。
      (function () {
        var dark = true;
        try {
          var mode = localStorage.getItem("refind-note:theme") || "system";
          dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          // 存储不可用时按深色兜底
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
