[package]
name = "refind-note"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "refind_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 复制代码、复制地址用它，而不是 navigator.clipboard：
# webview 里的 Web 剪贴板 API 在 Linux 上不保证可用，插件才是官方可靠路径。
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 用户主目录：三个系统三套说法（HOME / USERPROFILE / 实际配置目录），
# 自己挑环境变量不如走这个（它连"环境变量没有"的场面都兜得住）。
dirs = "7"

# ---- 存储仓库 ----

# 内容寻址：blob 的地址就是落盘字节的 sha256。
# 用最新一代（0.11）：这一代 API 与 0.10 不同，但安全更新只会往新版走，迁早就早。
sha2 = "0.11"
# 封装格式的压缩层。默认后端是纯 Rust 的 miniz_oxide，不引 C 依赖。
flate2 = "1"
# 封装格式的对称加密层（AEAD）与口令派生。
argon2 = "0.5"
# 生成 salt / nonce。
getrandom = "0.2"
# 封装头里的 salt / nonce 以文本存放（base64）。
base64 = "0.22"
# 时间戳用 RFC3339：建库时间、日志里的时间、草稿的修改时间。
time = { version = "0.3", features = ["formatting", "parsing"] }
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"

# ---- 渲染 ----

# 笔记正文的 markdown → HTML。默认 features 里含 syntect：它把代码高亮配色以内联
# style 写死，跟随不了主题，所以关掉；代码分词交给前端。
markdown-it = { version = "0.6", default-features = false, features = ["linkify"] }
include_dir = "0.7.4"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-deep-link = "2.6.1"
brotli = "9.0.0"
aes-gcm = "0.11.1"
sm4 = "0.6.0"
ureq = "3.4.2"
hmac = "0.13.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# ---- 平台专有 ----
#
# ⚠️ 下面两段 `[target.*.dependencies]` 必须待在 `[dependencies]` 的**末尾**。
#    TOML 里一旦出现新的表头，后面的行就都归那一张表 —— 通用依赖要是写在
#    桌面段后面，就会**静默地只对桌面生效**（Android 编译时报
#    `cannot find module or crate`）。这个坑我连踩两次，所以写在这里。

# 封装格式的 gpg 层：OpenPGP 自己实现是灾难，交给系统配置（走 gpgme）。
# 它要系统里有 libgpgme —— **桌面才有这个库**；手机上装不了，所以移动端根本不把
# 它编进来（代码那边有同名的桩，见 `storage/codec.rs` 里"系统 gpg"那一段）。
#
# 文件选择框也写在这一段里，因为它同样**分平台**：见下面那条的注释。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gpgme = "0.11"
# 桌面上要 `gtk3` 后端（走 rfd 的 GTK 实现）。
tauri-plugin-dialog = { version = "2.8.1", features = ["gtk3"] }

# 移动端：不能带任何 feature。
#
# 插件的默认 feature 是 `gtk3`（走 rfd 的 GTK 后端），而 `rfd` 只在它自己的
# `[target.'cfg(...linux...)]'` 那一条依赖里 —— **Android 上 rfd 压根不存在**。
# 于是构建脚本按编译目标生成权限清单时，gtk3 那套命令一个都生成不出来，
# `capabilities/default.json` 里的 `dialog:default` 报
# `Permission dialog:default not found`，构建在 build.rs 阶段就断掉。
#
# 而全局 `default-features = false` 也不行：那样 `rfd` 在桌面上失去后端，
# 它自己的 build.rs 会 panic（`You need to choose at least one backend`）。
# 两条路都试过，所以最后是**按平台分开声明**。移动端走插件自带的
# `#[cfg(mobile)] mod mobile` 分支（见它的 `src/lib.rs`），
# 内部用系统选择器，根本不需要 rfd。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-dialog = { version = "2.8.1", default-features = false }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
