[package]
name = "refind-note"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "refind_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 复制代码、复制地址用它，而不是 navigator.clipboard：
# webview 里的 Web 剪贴板 API 在 Linux 上不保证可用，插件才是官方可靠路径。
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 用户主目录：三个系统三套说法（HOME / USERPROFILE / 实际配置目录），
# 自己挑环境变量不如走这个（它连"环境变量没有"的场面都兜得住）。
dirs = "7"

# ---- 存储仓库 ----

# 内容寻址：blob 的地址就是落盘字节的 sha256。
# 用最新一代（0.11）：这一代 API 与 0.10 不同，但安全更新只会往新版走，迁早就早。
sha2 = "0.11"
# 封装格式的压缩层。默认后端是纯 Rust 的 miniz_oxide，不引 C 依赖。
flate2 = "1"
# 封装格式的对称加密层（AEAD）与口令派生。
argon2 = "0.5"
# 生成 salt / nonce。
getrandom = "0.2"
# 封装头里的 salt / nonce 以文本存放（base64）。
base64 = "0.22"
# 时间戳用 RFC3339：建库时间、日志里的时间、草稿的修改时间。
time = { version = "0.3", features = ["formatting", "parsing"] }

# ---- 平台专有 ----

# 封装格式的 gpg 层：OpenPGP 自己实现是灾难，交给系统配置（走 gpgme）。
# 它要系统里有 libgpgme —— **桌面才有这个库**；手机上装不了，所以移动端根本不把
# 它编进来（代码那边有同名的桩，见 `storage/codec.rs` 里"系统 gpg"那一段）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
gpgme = "0.11"

# ---- 渲染 ----

# 笔记正文的 markdown → HTML。默认 features 里含 syntect：它把代码高亮配色以内联
# style 写死，跟随不了主题，所以关掉；代码分词交给前端。
markdown-it = { version = "0.6", default-features = false, features = ["linkify"] }
tauri-plugin-dialog = "2.8.1"
include_dir = "0.7.4"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-deep-link = "2.6.1"
brotli = "9.0.0"
aes-gcm = "0.11.1"
sm4 = "0.6.0"
ureq = "3.4.2"
hmac = "0.13.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
