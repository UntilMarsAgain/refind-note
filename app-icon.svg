<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="重逢 refind">
  <!--
    **应用图标**的源文件（程序图标、任务栏、桌面快捷方式、文件管理器里那个）。

    与 `public/logo.svg` 的分工：
    - `public/logo.svg` —— **界面里**用的（标题栏、菜单），透明底，跟着主题换；
    - 这个 —— **图标**用的，必须自带底块。

    ## 为什么这里要有底块，而 logo.svg 没有

    `public/logo.svg` 是半透明白图形，靠**界面自己的深色底**显出来（那个文件开头
    的注释就是这个意思）。但应用图标出现在**文件管理器、任务栏、启动器**里，
    底色由**系统主题**决定 —— 浅色主题下白图形就看不见了。所以图标必须自带底。

    ## 底色为什么是 #201c1c

    正好是 `public/logo-light.svg` 里那个深色：同一个色系的两版互为反相，
    于是"深色图标"与"浅色图标"看起来是同一个标志，而不是两个标志。

    ## 底块为什么是超椭圆而不是圆角矩形

    圆角矩形在拐角处曲率是突变的（从直边直接切到圆弧），看起来"方的圆角"；
    超椭圆（`|x/a|^n + |y/a|^n = 1`，n=5）曲率连续变化，也就是 iOS/macOS
    那种连续圆角。放大看差别很明显。

    ## 图形放大到 118%

    原图那个形在 128 的画布里占 52%（35→93）。放到满幅底块里若不放大，
    任务栏那种 16–32px 的尺寸下会显得缩 —— 那正是最需要看得清的地方。
    118% 让它占到约六成，与常见应用图标的占比一致，且离底块边缘仍有余量。

    ## 改这个文件后要重新生成

        npx tauri icon app-icon.svg

    生成物在 `src-tauri/icons/`（已入库），`tauri.conf.json` 与
    `packaging/arch/PKGBUILD` 都从那里取。
  -->
  <path d="M128.0 64.0L127.9 85.5L127.8 92.3L127.5 97.3L127.1 101.3L126.6 104.6L126.0 107.6L125.3 110.2L124.4 112.5L123.4 114.6L122.3 116.5L121.1 118.2L119.7 119.7L118.2 121.1L116.5 122.3L114.6 123.4L112.5 124.4L110.2 125.3L107.6 126.0L104.6 126.6L101.3 127.1L97.3 127.5L92.3 127.8L85.5 127.9L64.0 128.0L42.5 127.9L35.7 127.8L30.7 127.5L26.7 127.1L23.4 126.6L20.4 126.0L17.8 125.3L15.5 124.4L13.4 123.4L11.5 122.3L9.8 121.1L8.3 119.7L6.9 118.2L5.7 116.5L4.6 114.6L3.6 112.5L2.7 110.2L2.0 107.6L1.4 104.6L0.9 101.3L0.5 97.3L0.2 92.3L0.1 85.5L0.0 64.0L0.1 42.5L0.2 35.7L0.5 30.7L0.9 26.7L1.4 23.4L2.0 20.4L2.7 17.8L3.6 15.5L4.6 13.4L5.7 11.5L6.9 9.8L8.3 8.3L9.8 6.9L11.5 5.7L13.4 4.6L15.5 3.6L17.8 2.7L20.4 2.0L23.4 1.4L26.7 0.9L30.7 0.5L35.7 0.2L42.5 0.1L64.0 0.0L85.5 0.1L92.3 0.2L97.3 0.5L101.3 0.9L104.6 1.4L107.6 2.0L110.2 2.7L112.5 3.6L114.6 4.6L116.5 5.7L118.2 6.9L119.7 8.3L121.1 9.8L122.3 11.5L123.4 13.4L124.4 15.5L125.3 17.8L126.0 20.4L126.6 23.4L127.1 26.7L127.5 30.7L127.8 35.7L127.9 42.5Z" fill="#201c1c"/>
  <g transform="translate(64 64) scale(1.18) translate(-64 -64)">
    <path
      d="M76 93H52A17 17 0 0 1 35 76V52A17 17 0 0 1 52 35h24A17 17 0 0 1 93 52v24"
      fill="none"
      stroke="#e8e8e8"
      stroke-width="9"
