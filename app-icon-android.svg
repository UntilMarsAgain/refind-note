<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="重逢 refind">
  <!--
    **Android 启动图标**的源文件。

    与 `app-icon.svg`（桌面/通用）**分开**是有原因的，不是重复：
    Android 的自适应图标（adaptive icon）有自己的留白规矩，
    按桌面的尺寸画会被系统裁得显���被放大。

    ## 缩多少：让图形待进中间那块，四周**要留出看得见的空**

    `tauri icon` 生成的 `ic_launcher_foreground.png` 是 **108dp 的方形画布**，
    而系统只保证**中间 72dp** 不被各种遮罩（圆形、方形、水滴…）裁掉：

    - 108dp：画布
    - 72dp：安全区 ← **图形应该待在这里面**
    - 66dp：最保守（圆形遮罩的内切）

    ⚠️ 缩多少是**量出来的，不是猜的**：解开打包用的那张 PNG，扫 alpha>0 的像素
    范围，就知道图形占了画布多少、四周留白多少。

    我第一版写 `0.667 × 1.18 = 0.787`，以为"缩到 72/108"就对了。实测：

        图形实际占画布 100%，左右留白 0px

    ——**满幅顶到边**，正是"没有边框"的样子：深色底铺满、图形直接压在边上，
    中间那道留白一点没有；系统再按遮罩一裁，反而显得图形更大。

    现在外层 `0.467 × 内层 1.18 = 0.551`：图形在 128 画布里占约 37 单位，
    换算到 108dp 画布约 31dp，四周各留约 13dp —— 在 72dp 安全区内，
    而且**留白看得出来**（那圈空就是你要的"边框"）。

    ## 那为什么不反过来把桌面图标也缩

    桌面（Windows 任务栏、macOS Dock、Linux 启动器）没有这一层裁切，
    满幅是合适的。所以两个源文件各画各的：`app-icon.svg` 满幅给桌面，
    这个缩一档给 Android。

    重新生成（**顺序不能反**）：

        npx tauri icon app-icon.svg         # 桌面/通用
        npx tauri icon app-icon-android.svg # Android 专用

    ⚠️ 两条**共用同一个输出目录**，所以**后跑的那条会覆盖前一条的 android/ 部分**。
    于是顺序必须是"Android 版**最后**跑"，否则启动器拿到的是桌面那版（满幅、
    被放大）。这不是我猜的：先跑 Android 版再跑桌面版，实测图标立刻变大回弹。

    跑完还要把 `src-tauri/icons/android/` 同步到
    `src-tauri/gen/android/app/src/main/res/` —— 后者是 `tauri android init`
    生成的，带着**当时**那份，图标改了不会自动跟着变（这个坑也踩过）。
  -->
  <!--
    满幅深色底。

    为什么底要画在这里、而不是靠 `ic_launcher_background`：
    `tauri icon` 生成 Android 前景时会把源**放大到铺满画布**，所以底跟着一起
    被烙进去 —— 实测生成出来的前景是「深色底 + 白图形、四周留白 0px」。
    于是 `ic_launcher_background` 那层只在这一张图**画不满**的地方才看得到，
    而实测它盖不住。底画在源里反而可靠：它与图形一起被同比例缩放。

    形状是超椭圆（`|x/a|^n + |y/a|^n = 1`，n=5）—— 曲率连续变化，
    也就是 iOS/macOS 那种连续圆角；圆角矩形在拐角处曲率是突变的。
  -->
